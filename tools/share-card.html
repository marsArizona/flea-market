<!doctype html>
<!-- Plantilla de la imagen para compartir de cada producto (1200x630).
     build.py la captura con ?slug=<producto> y guarda site/share/<slug>.jpg -->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
  .card {
    display: grid;
    grid-template-columns: 560px 1fr;
    width: 1200px;
    height: 630px;
  }
  /* left: the item on its shelf */
  .bay {
    display: grid;
    grid-template-rows: 1fr 24px 44px;
    background: var(--back);
    border-right: 12px solid var(--ink);
    border-left: 12px solid var(--ink);
  }
  .stand { display: flex; align-items: flex-end; justify-content: center; padding: 34px 30px 0; min-height: 0; }
  .photo { position: relative; max-height: 100%; margin-bottom: -4px; z-index: 2; }
  .photo img { display: block; max-height: 520px; max-width: 490px; width: auto; height: auto; box-shadow: 0 14px 24px -14px rgb(0 0 0 / 0.55); }
  .rail { background: var(--orange); border-top: 6px solid var(--ground-hi); box-shadow: 0 10px 16px -8px rgb(0 0 0 / 0.45); position: relative; z-index: 1; }
  .sold .photo img { filter: grayscale(0.85) contrast(0.9); }
  .card .hanko { width: 170px; }
  .card .hanko-jp { font-size: 40px; }
  .card .hanko-es { font-size: 14px; }

  /* right: sign, name, price strip */
  .info { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .noren-strip {
    display: grid;
    grid-template-columns: 1.25fr 1fr 1.15fr;
    gap: 6px;
    padding: 0 40px 0 34px;
  }
  .noren-strip span {
    display: grid;
    place-items: end center;
    height: 92px;
    padding-bottom: 14px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--display);
    font-size: 26px;
    line-height: 1;
    text-transform: uppercase;
    border-top: 12px solid #000;
  }
  .body { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 48px 0 46px; }
  .name {
    margin: 0;
    font-family: var(--display);
    font-size: 54px;
    line-height: 1.08;
    color: var(--ink);
    text-wrap: balance;
  }
  .name.long { font-size: 44px; }
  .strip {
    align-self: flex-start;
    position: relative;
    padding: 22px 26px 14px;
    background: var(--paper);
    box-shadow: 0 1px 0 rgb(0 0 0 / 0.15), 0 12px 18px -8px rgb(0 0 0 / 0.4);
    rotate: -2deg;
  }
  .strip::before { content: ""; position: absolute; top: 8px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink); }
  .price { font-family: var(--marker); font-size: 76px; line-height: 1; color: var(--orange-deep); font-variant-numeric: tabular-nums; }
  .price small { font-family: var(--body); font-weight: 700; font-size: 24px; margin-left: 8px; color: var(--ink-2); }
  .sold .price { text-decoration: line-through; text-decoration-thickness: 4px; }
  .cond {
    margin: 0;
    max-width: 30ch;
    font-size: 24px;
    line-height: 1.35;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cond b { color: var(--ink); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bay">
    <div class="stand"><div class="photo" id="photo"></div></div>
    <div class="rail"></div>
    <div></div>
  </div>
  <div class="info">
    <div class="noren-strip"><span>Bastians</span><span>Flea</span><span>Market</span></div>
    <div class="body">
      <h1 class="name" id="name"></h1>
      <div class="strip"><div class="price" id="price"></div></div>
      <p class="cond" id="cond"></p>
    </div>
  </div>
</div>
<script src="../site/data.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("slug");
  const p = (window.SHOP.products || []).find((x) => x.slug === slug) || window.SHOP.products[0];
  const money = new Intl.NumberFormat("es-MX", { maximumFractionDigits: 0 });
  const card = document.getElementById("card");
  if (p.sold) card.classList.add("sold");

  const img = new Image();
  img.src = "../site/" + p.photos[0].src;
  img.alt = "";
  document.getElementById("photo").append(img);
  if (p.sold) {
    const h = document.createElement("span");
    h.className = "hanko";
    h.innerHTML = '<span class="hanko-jp" lang="ja">売約済</span><span class="hanko-es">VENDIDO</span>';
    document.getElementById("photo").append(h);
  }

  const name = document.getElementById("name");
  name.textContent = `${p.brand} ${p.model}`;
  if (name.textContent.length > 18) name.classList.add("long");

  const price = document.getElementById("price");
  price.textContent = p.price == null ? "Pregunta" : "$" + money.format(p.price);
  if (p.price != null) price.insertAdjacentHTML("beforeend", "<small>MXN</small>");

  const cond = document.getElementById("cond");
  if (p.sold) cond.innerHTML = "<b>Vendido.</b>";
  else if (p.condition) {
    const b = document.createElement("b");
    b.textContent = "Estado: ";
    cond.append(b, p.condition);
  }
</script>
</body>
</html>
