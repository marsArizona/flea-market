<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--ground)}
.og{position:relative;width:1200px;height:630px;padding:0 40px;box-sizing:border-box}
.og .noren{padding:0}.og .noren-rod{margin:0}.og .noren-panel{min-height:150px;animation:none}
.og .noren-word{font-size:64px}
.og .mon{font-size:40px}
.og-shelf{position:absolute;left:40px;right:40px;bottom:0;top:200px;display:grid;grid-template-columns:60px 1fr;border:12px solid var(--ink);border-bottom:0}
.og-bay{background:var(--back);display:grid;grid-template-rows:1fr 24px auto;padding-top:26px}
.og-items{display:flex;align-items:flex-end;justify-content:space-evenly}
.og-items img{height:236px;width:auto;box-shadow:0 12px 20px -12px rgb(0 0 0/.5);position:relative;z-index:2;margin-bottom:-4px}
.og-rail{background:var(--orange);border-top:6px solid var(--ground-hi);box-sizing:border-box;box-shadow:0 10px 16px -8px rgb(0 0 0/.45)}
.og-line{margin:0;padding:22px 0 26px;text-align:center;font-family:var(--display);font-size:38px;line-height:1.2;color:var(--ink)}
.og-line b{font-family:var(--marker);font-weight:400;color:var(--orange-deep)}
</style></head><body>
<div class="og">
<header class="noren"><div class="noren-rod"></div><div class="noren-cloth">
<div class="noren-panel"><span class="noren-word">Bastians</span></div>
<div class="noren-panel"><span class="mon">市</span><span class="noren-word">Flea</span></div>
<div class="noren-panel"><span class="noren-jp">蚤の市</span><span class="noren-word">Market</span></div>
</div></header>
<div class="og-shelf"><h2 class="shelf-sign"><span class="shelf-sign-kanji">市</span></h2>
<div class="og-bay"><div class="og-items">
<img src="img/gretsch-junior-jet-bass-ii/1.jpg"><img src="img/akai-mpc-one/1.jpg"><img src="img/tascam-model-12/1.jpg"><img src="img/meters-ov-1-b-connect/1.jpg"><img src="img/behringer-td-3/1.jpg">
</div><div class="og-rail"></div>
<p class="og-line">Equipo de audio y música, <b>desde $1,000</b></p>
</div></div>
</div></body></html>
